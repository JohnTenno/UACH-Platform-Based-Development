<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" th:data-bs-theme="${darkMode} ? 'dark' : 'light'" >
  <head>
    <meta charset="UTF-8" />
    <title>Profile</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>

  <body class="bg text-light"  >
    <div class="container mt-5">
      <div class="row justify-content-center">
        <div class="col-lg-8">
          <div class="card shadow-lg border-0">
            <div class="card-body text-center">
              <img
                th:src="${user.profilePictureUrl}"
                class="rounded-circle mb-3"
                width="120"
                height="120"
                alt="Profile Picture"
              />

              <ul class="nav nav-tabs justify-content-center" role="tablist">
                <li class="nav-item">
                  <button
                    class="nav-link active"
                    data-bs-toggle="tab"
                    data-bs-target="#nameTab"
                    type="button"
                  >
                    Nombre
                  </button>
                </li>

                <li class="nav-item">
                  <button
                    class="nav-link"
                    data-bs-toggle="tab"
                    data-bs-target="#emailTab"
                    type="button"
                  >
                    Email
                  </button>
                </li>

                <li class="nav-item">
                  <button
                    class="nav-link"
                    data-bs-toggle="tab"
                    data-bs-target="#githubTab"
                    type="button"
                  >
                    Github
                  </button>
                </li>

                <li class="nav-item dropdown">
                  <a
                    class="nav-link dropdown-toggle"
                    data-bs-toggle="dropdown"
                    href="#"
                  >
                    Herramientas
                  </a>
                  <ul class="dropdown-menu">
                    <li th:each="tool : ${user.tools}">
                      <span class="dropdown-item" th:text="${tool}"></span>
                    </li>
                  </ul>
                </li>
              </ul>

              <div class="tab-content mt-3">
                <div class="tab-pane fade show active" id="nameTab">
                  <h5 th:text="${user.name}"></h5>
                </div>

                <div class="tab-pane fade" id="emailTab">
                  <h5 th:text="${user.email}"></h5>
                </div>

                <div class="tab-pane fade" id="githubTab">
                  <a
                    th:if="${user.github != null}"
                    th:href="${user.github}"
                    target="_blank"
                  >
                    Ir a Github
                  </a>
                  <span th:if="${user.github == null}">No disponible</span>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
