<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <style>
      .small-box .small-box-footer {
        color: #ffffff !important;
        text-align: center;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        font-weight: 500;
      }
      .small-box .small-box-footer i {
        color: #ffffff !important;
      }
      .small-box .small-box-footer:hover {
        text-decoration: none;
        color: #ffffff !important;
        opacity: 0.9;
      }
    </style>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dashboard</title>

    <link
      rel="stylesheet"
      th:href="@{/adminlte/plugins/fontawesome-free/css/all.min.css}"
    />
    <link rel="stylesheet" th:href="@{/adminlte/dist/css/adminlte.min.css}" />

    <style>
      .small-box {
        overflow: visible !important;
      }
      .small-box .dropdown-menu {
        z-index: 2000;
      }
      .small-box .small-box-footer {
        position: relative;
        z-index: 2001;
        cursor: pointer;
      }
    </style>
  </head>

  <body class="hold-transition sidebar-mini">
    <div class="wrapper">
      <nav class="main-header navbar navbar-expand navbar-white navbar-light">
        <ul class="navbar-nav">
          <li class="nav-item">
            <a class="nav-link" data-widget="pushmenu" href="#">
              <i class="fas fa-bars"></i>
            </a>
          </li>
        </ul>
        <ul class="navbar-nav ml-auto">
          <li class="nav-item d-none d-sm-inline-block">
            <a href="#" class="nav-link">Home</a>
          </li>
          <li class="nav-item d-none d-sm-inline-block">
            <a href="#" class="nav-link">Dashboard</a>
          </li>
        </ul>
      </nav>

      <aside class="main-sidebar sidebar-dark-primary elevation-4">
        <div class="sidebar">
          <div class="user-panel mt-3 pb-3 mb-3 d-flex">
            <div class="image">
              <img
                th:src="${profilePictureUrl}"
                class="img-circle elevation-2"
                alt="User"
              />
            </div>
            <div class="info">
              <a href="#" class="d-block" th:text="${name}">User</a>
            </div>
          </div>

          <div class="form-inline">
            <div class="input-group" data-widget="sidebar-search">
              <input
                class="form-control form-control-sidebar"
                type="search"
                placeholder="Search"
              />
              <div class="input-group-append">
                <button class="btn btn-sidebar">
                  <i class="fas fa-search fa-fw"></i>
                </button>
              </div>
            </div>
          </div>

          <nav class="mt-2">
            <ul class="nav nav-pills nav-sidebar flex-column">
              <li class="nav-item">
                <a th:href="@{/}" class="nav-link active">
                  <i class="nav-icon fas fa-home"></i>
                  <p>Home</p>
                </a>
              </li>

              <li class="nav-header">LABELS</li>
              <li class="nav-item">
                <a href="#" class="nav-link">
                  <i class="nav-icon far fa-circle text-danger"></i>
                  <p>Important</p>
                </a>
              </li>
              <li class="nav-item">
                <a href="#" class="nav-link">
                  <i class="nav-icon far fa-circle text-warning"></i>
                  <p>Warning</p>
                </a>
              </li>
              <li class="nav-item">
                <a href="#" class="nav-link">
                  <i class="nav-icon far fa-circle text-info"></i>
                  <p>Informational</p>
                </a>
              </li>
            </ul>
          </nav>
        </div>
      </aside>

      <div class="content-wrapper">
        <section class="content-header">
          <div class="container-fluid"><h1>Dashboard</h1></div>
        </section>

        <section class="content">
          <div class="container-fluid">
            <div class="row">
              <div class="col-lg-3 col-6">
                <div class="small-box bg-info">
                  <div class="inner">
                    <h3 th:text="${steamGames}">0</h3>
                    <p>Games</p>
                  </div>
                  <div class="icon"><i class="fas fa-shopping-bag"></i></div>

                  <div class="dropdown">
                    <a
                      class="small-box-footer dropdown-toggle"
                      href="#"
                      data-toggle="dropdown"
                      onclick="return false;"
                    >
                      View games
                      <i class="fas fa-arrow-circle-right"></i>
                    </a>
                    <div class="dropdown-menu dropdown-menu-right">
                      <button
                        class="dropdown-item"
                        type="button"
                        th:each="x : ${steamGamesOptions}"
                        th:text="${x}"
                      >
                        Item
                      </button>
                    </div>
                  </div>
                </div>
              </div>

              <div class="col-lg-3 col-6">
                <div class="small-box bg-success">
                  <div class="inner">
                    <h3>
                      <span th:text="${archivements}">0</span>
                      <sup style="font-size: 20px">%</sup>
                    </h3>
                    <p>Archivements</p>
                  </div>
                  <div class="icon"><i class="fas fa-chart-bar"></i></div>

                  <div class="dropdown">
                    <a
                      class="small-box-footer dropdown-toggle"
                      href="#"
                      data-toggle="dropdown"
                      onclick="return false;"
                    >
                      archivements
                      <i class="fas fa-arrow-circle-right"></i>
                    </a>
                    <div class="dropdown-menu dropdown-menu-right">
                      <button
                        class="dropdown-item"
                        type="button"
                        th:each="x : ${archivementsOptions}"
                        th:text="${x}"
                      >
                        view archivements 
                      </button>
                    </div>
                  </div>
                </div>
              </div>

              <div class="col-lg-3 col-6">
                <div class="small-box bg-warning">
                  <div class="inner">
                    <h3 th:text="${friends}">0</h3>
                    <p>Friends</p>
                  </div>
                  <div class="icon"><i class="fas fa-user-plus"></i></div>

                  <div class="dropdown">
                    <a
                      class="small-box-footer dropdown-toggle"
                      href="#"
                      data-toggle="dropdown"
                      onclick="return false;"
                    >
                      View friends
                      <i class="fas fa-arrow-circle-right"></i>
                    </a>
                    <div class="dropdown-menu dropdown-menu-right">
                      <button
                        class="dropdown-item"
                        type="button"
                        th:each="x : ${friendsOptions}"
                        th:text="${x}"
                      >
                        Item
                      </button>
                    </div>
                  </div>
                </div>
              </div>

              <div class="col-lg-3 col-6">
                <div class="small-box bg-danger">
                  <div class="inner">
                    <h3 th:text="${money}">0</h3>
                    <p>Money</p>
                  </div>
                  <div class="icon"><i class="fas fa-chart-pie"></i></div>

                  <div class="dropdown">
                    <a
                      class="small-box-footer dropdown-toggle"
                      href="#"
                      data-toggle="dropdown"
                      onclick="return false;"
                    >
                       Money Options
                      <i class="fas fa-arrow-circle-right"></i>
                    </a>
                    <div class="dropdown-menu dropdown-menu-right">
                      <button
                        class="dropdown-item"
                        type="button"
                        th:each="x : ${moneyOptions}"
                        th:text="${x}"
                      >
                        Item
                      </button>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </section>
      </div>
    </div>

    <script th:src="@{/adminlte/plugins/jquery/jquery.min.js}"></script>
    <script
      th:src="@{/adminlte/plugins/bootstrap/js/bootstrap.bundle.min.js}"
    ></script>
    <script th:src="@{/adminlte/dist/js/adminlte.min.js}"></script>
  </body>
</html>
